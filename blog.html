<div id="nav-spacer" style="height:60px;"></div>
<script>
// 导航栏固定在顶部，给下面的内容留出同样高度的空间
(function () {
  function fit() {
    var n = document.getElementById('nav');
    document.getElementById('nav-spacer').style.height = n.offsetHeight + 'px';
  }
  window.addEventListener('load', fit);
  window.addEventListener('resize', fit);
})();
</script>

<div class="blog-wrap">
  <h2 class="page-title">Blog</h2>
  <div id="post-list"></div>
</div>

<div id="footer">
  <div class="container text-center">
    <div class="fnav">

    </div>

<script type="text/javascript" src="mypage/js/jquery.1.11.1.js"></script>
<script type="text/javascript" src="mypage/js/bootstrap.js"></script>
<script src="blog.js"></script>
<script>
// ===== 文章文件名列表（posts/ 下的 .js 文件名，不含 .js；顺序随意，会按日期排序）=====
// 浏览器在 file:// 下无法读取文件夹内容，所以新文章需要在这里登记文件名
const POSTS = [
    "hello-world",
];
// ===== 列表结束 =====

Blog.loadPosts(POSTS, function (posts) {
    const list = document.getElementById('post-list');
    posts.sort((a, b) => b.date.localeCompare(a.date));
    if (posts.length === 0) {
        list.innerHTML = '<p class="text-center">No posts yet.</p>';
        return;
    }
    list.innerHTML = posts.map(p => `
      <a class="post-card" href="post.html?id=${encodeURIComponent(p.id)}">
        <div class="post-title">${Blog.esc(p.title)}</div>
        ${Blog.metaHtml(p)}
        <div class="post-summary">${Blog.esc(p.summary)}</div>
      </a>`).join('');
});
</script>

</body>
