<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script type="text/javascript" src="mypage/js/jquery.1.11.1.js"></script>
<script type="text/javascript" src="mypage/js/bootstrap.js"></script>
<script src="blog.js"></script>
<script>
// 通用文章页：post.html?id=<文件名>，显示 posts/<文件名>.js
(function () {
    const box = document.getElementById('post');
    const id = new URLSearchParams(location.search).get('id') || '';

    if (!/^[A-Za-z0-9_-]+$/.test(id)) {
        box.innerHTML = '<p>Post not found.</p>';
        return;
    }

    Blog.loadPosts([id], function (posts) {
        const post = posts[0];
        if (!post) {
            box.innerHTML = '<p>Post not found.</p>';
            return;
        }
        document.title = post.title + ' | Ying Zhang';
        box.innerHTML =
            '<div class="post-header"><h1>' + Blog.esc(post.title) + '</h1>' + Blog.metaHtml(post) + '</div>' +
            '<div class="post-body">' + Blog.renderMarkdown(post.markdown) + '</div>';
    });
})();
</script>
